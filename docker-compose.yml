name: limart

services:
  # ----------------------------------------------------------------------------
  # 1. Limart API Service (Bun / Node.js Hono API)
  # ----------------------------------------------------------------------------
  limart-api:
    image: ghcr.io/khanhduong22/limart/checkin-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: limart-api
    init: true
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://kido:KidoVPS2026!@limart-db:5432/checkin_db?sslmode=disable}
      - REDIS_URL=${REDIS_URL:-redis://limart-valkey:6379}
      - MEILISEARCH_HOST=${MEILISEARCH_HOST:-http://meilisearch:7700}
      - MEILISEARCH_KEY=${MEILISEARCH_KEY:-kt_meilisearch_master_key_2026_safe}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-checkin-app-jwt-secret-monorepo-safe-2026}
    env_file:
      - .env
    depends_on:
      - limart-db
      - limart-valkey
    networks:
      ops_bridge:
        aliases:
          - limart-api
          - checkin-api-v2
          - checkin-api
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/health | grep -q '\"status\":\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. Limart Admin SPA (Vite React + Nginx Alpine static server)
  # ----------------------------------------------------------------------------
  limart-admin:
    image: ghcr.io/khanhduong22/limart/checkin-admin:latest
    build:
      context: .
      dockerfile: apps/admin-spa/Dockerfile
    container_name: limart-admin
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      ops_bridge:
        aliases:
          - limart-admin
          - checkin-admin-v2
          - checkin-admin
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. Limart Staff PWA (Vite React PWA + Nginx Alpine static server)
  # ----------------------------------------------------------------------------
  limart-staff:
    image: ghcr.io/khanhduong22/limart/checkin-staff:latest
    build:
      context: .
      dockerfile: apps/staff-pwa/Dockerfile
    container_name: limart-staff
    restart: unless-stopped
    expose:
      - "3002"
    networks:
      ops_bridge:
        aliases:
          - limart-staff
          - checkin-staff-v2
          - checkin-staff
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3002/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 4. Limart Valkey Cache (High performance Redis-compatible cache)
  # ----------------------------------------------------------------------------
  limart-valkey:
    image: valkey/valkey:8-alpine
    container_name: limart-valkey
    restart: unless-stopped
    command: valkey-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6389:6379"
    mem_limit: 64m
    networks:
      ops_bridge:
        aliases:
          - limart-valkey
          - checkin-valkey

  # ----------------------------------------------------------------------------
  # 5. PostgreSQL 17 Database with pgvector
  # ----------------------------------------------------------------------------
  limart-db:
    image: pgvector/pgvector:pg17
    container_name: limart-db
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: checkin_db
      POSTGRES_USER: kido
      POSTGRES_PASSWORD: KidoVPS2026!
    volumes:
      - checkin-app_checkin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kido -d checkin_db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      ops_bridge:
        aliases:
          - limart-db
          - checkin-db

networks:
  ops_bridge:
    external: true

volumes:
  checkin-app_checkin_pgdata:
    external: true
